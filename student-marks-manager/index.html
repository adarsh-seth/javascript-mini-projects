<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student marks manager</title>
</head>
<body bgcolor="pink">
    <input  id="Input_Marks" type="number" placeholder="Enter your marks">
    <button id="AddMarks">Add marks</button>
    <div id="addedMarks"></div>
    <p>Total Marks: <span id="totalMarks"></span></p>
    <p>Average Marks: <span id="avgMarks"></span></p>
    <p>Highest Marks: <span id="highMarks"></span></p>
    <p>Lowest Marks: <span id="lowMarks"></span></p>
    <input  id="search_Marks" type="number" placeholder="Search marks">
    <button id="searchMarks">Search</button>
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
